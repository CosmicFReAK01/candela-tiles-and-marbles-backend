server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
  tomcat:
    threads:
      min-spare: 2
      max: 10
    max-connections: 50
    accept-count: 20

spring:
  application:
    name: candela-monolith

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:candela_web}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CandelaHikariPool
      minimum-idle: 1
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
        boot:
          allow_jdbc_metadata_access: false
        format_sql: false
        generate_statistics: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
      refresh-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    rate-limit:
      login-max-attempts: 5
      login-window-minutes: 15
      enquiry-max-attempts: 10
      enquiry-window-minutes: 15
  storage:
    type: ${STORAGE_TYPE:supabase}
    supabase:
      url: ${NEXT_PUBLIC_SUPABASE_URL:${SUPABASE_URL:}}
      service-key: ${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SERVICE_KEY:}}
      bucket: ${SUPABASE_STORAGE_BUCKET:candela-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info,startup
  endpoint:
    health:
      show-details: when-authorized
    startup:
      enabled: true

logging:
  level:
    root: INFO
    com.candela: INFO
    org.hibernate.SQL: WARN
