server:
  port: 0

spring:
  application:
    name: candela-monolith-test

  datasource:
    url: jdbc:h2:mem:candelatest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: TestHikariPool
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

context:
  initializer:
    classes: com.candela.security.EphemeralJwtKeyInitializer

app:
  security:
    jwt:
      # Injected dynamically at runtime by EphemeralJwtKeyInitializer
      secret: ${JWT_SECRET:}
      expiration-ms: 900000
      refresh-expiration-days: 7
    cors:
      allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost"
    rate-limit:
      login-max-attempts: 5
      login-window-minutes: 15
      enquiry-max-attempts: 10
      enquiry-window-minutes: 15
  storage:
    type: mock
    supabase:
      url: "http://localhost:54321"
      service-key: ""
      bucket: "test-bucket"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.candela: INFO
